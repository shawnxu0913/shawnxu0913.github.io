<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 488' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' role='img' aria-label='Learned models plan the run; search plays each fight'>
