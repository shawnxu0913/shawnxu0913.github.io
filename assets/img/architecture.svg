<text x='56' y='280' font-weight='600' fill='#1f2328'>Causal event table</text>
<text x='56' y='298' font-size='11.5' fill='#59636e'>Picks options by measured effect on winning</text>
<rect x='40' y='336' width='304' height='56' rx='8' fill='white' stroke='#9a9a92' stroke-width='1.25'/>
<text x='56' y='360' font-weight='600' fill='#1f2328'>Shop, potions, rest</text>
<text x='56' y='378' font-size='11.5' fill='#59636e'>Relics over cards; potions on lethal hits</text>
