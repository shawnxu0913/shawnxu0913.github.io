<text x='432' y='200' font-weight='600' fill='#1f2328'>Combat search (default)</text>
<text x='432' y='218' font-size='11.5' fill='#59636e'>3-turn lookahead, learned leaf evaluation</text>
<rect x='416' y='256' width='304' height='56' rx='8' fill='white' stroke='#9a9a92' stroke-width='1.25'/>
<text x='432' y='280' font-weight='600' fill='#1f2328'>Fallback strategies</text>
<text x='432' y='298' font-size='11.5' fill='#59636e'>Deeper, racing and potion-drinking arms</text>
<rect x='416' y='336' width='304' height='56' rx='8' fill='white' stroke='#9a9a92' stroke-width='1.25'/>
